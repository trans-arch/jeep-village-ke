services:
  - type: web
    name: jeep-village-pilot
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: jeep-village-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BOOTSTRAP_TOKEN
        generateValue: true
